<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>MeeNav</title><link rel="stylesheet" href="ui.css"><script defer src="ui.js"></script></head>
<body><nav aria-label="Tabs"><strong>MeeNav</strong><div id="tabs"></div><button id="open" aria-label="New tab">+</button></nav>
<form id="toolbar"><button type="button" id="back" aria-label="Back">←</button><button type="button" id="forward" aria-label="Forward">→</button><button type="button" id="reload" aria-label="Reload">↻</button><button type="button" id="home">Home</button>
<input id="address" aria-label="Address or query" placeholder="Search Google or enter an address" autocomplete="off" spellcheck="false">
<button type="submit">Go</button><button type="button" id="ai">AI Search</button><button type="button" id="bookmark" aria-label="Toggle bookmark">☆</button><select id="bookmarks" aria-label="Bookmarks"></select><button type="button" id="ladybird">Ladybird</button></form>
<div id="status" role="status"></div></body></html>
